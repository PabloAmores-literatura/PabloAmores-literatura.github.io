<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pablo Amores</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f7f7f5;
            color: #222;
            font-family: Georgia, serif;
        }

        header {
            text-align: center;
            padding: 45px 20px 55px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            font-weight: normal;
        }

        main {
            width: 94%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .entrada {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 55px;
            margin-bottom: 110px;
            align-items: start;
        }

        .texto {
            font-size: 19px;
            line-height: 1.75;
        }

        .texto p {
            margin-top: 0;
            margin-bottom: 1.5em;
        }

        .video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
}

.video-container iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 0;
}

        @media (max-width: 700px) {
            .entrada {
                grid-template-columns: 1fr;
                gap: 30px;
                margin-bottom: 80px;
            }

            .video {
                order: -1;
            }

            header {
                padding: 35px 20px 45px;
            }

            header h1 {
                font-size: 34px;
            }

            .texto {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Pablo Amores</h1>
    </header>

    <main>

        <article class="entrada">

            <div class="texto">
                <p>
                    Un Hongo Bonito.
                </p>

                <p>
                    Puedes escribir todo lo que quieras. El texto aparecerá
                    junto al vídeo en ordenador y debajo del vídeo en móvil.
                </p>
            </div>

            <div class="video">
    <div class="video-container">
        <iframe
            src="https://www.youtube.com/embed/CnpvrWACSmE"
            title="Pablo Amores"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>
</div>

        </article>

    </main>

</body>
</html>
