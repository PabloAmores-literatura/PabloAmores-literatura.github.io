<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pablo Amores</title>

    <style>
    body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #e8e5df;
        font-family: Georgia, "Times New Roman", serif;
    }

    header {
        text-align: center;
        padding: 55px 20px 70px;
    }

    header h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 46px;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -1px;
    }
        
.libro {
    margin-top: 22px;
    font-size: 16px;
}

.libro a {
    color: #e8e5df;
    text-decoration: underline;
    text-underline-offset: 3px;
}

.libro a:hover {
    opacity: 0.65;
}
        
    main {
        width: 94%;
        max-width: 1400px;
        margin: 0 auto;
    }

    .entrada {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 55px;
        margin-bottom: 120px;
        align-items: start;
    }

    .texto {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 19px;
        line-height: 1.8;
        letter-spacing: 0.1px;
    }

    .texto p {
        margin-top: 0;
        margin-bottom: 1.6em;
    }

    .video-container {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
    }

    .video-container iframe {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 0;
    }

    @media (max-width: 700px) {
        .entrada {
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 80px;
        }

        .video {
            order: -1;
        }

        header {
            padding: 40px 20px 50px;
        }

        header h1 {
            font-size: 36px;
        }

        .texto {
            font-size: 18px;
            line-height: 1.75;
        }
    }
</style>
</head>

<body>

    <header>
    <h1>Pablo Amores</h1>

    <p class="libro">
        <em>Desde un Rincón del Mediterráneo</em>
        ·
        <a href="https://edicionesmalaedad.bigcartel.com/product/desde-un-rincón-del-mediterráneo" target="_blank">
            Comprar el libro
        </a>
    </p>
</header>

    <main>

        <article class="entrada">

            <div class="texto">
                <p>
                    Un Hongo Bonito.
                </p>

                <p>
                    Puedes escribir todo lo que quieras. El texto aparecerá
                    junto al vídeo en ordenador y debajo del vídeo en móvil.
                </p>
            </div>

            <div class="video">
    <div class="video-container">
        <iframe
            src="https://www.youtube.com/embed/CnpvrWACSmE"
            title="Pablo Amores"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>
</div>

        </article>

    </main>

</body>
</html>
